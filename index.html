<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080808">
  <meta name="description" content="Razor Barbearia — escolha seu atendimento pelo WhatsApp.">
  <title>Razor Barbearia</title>

  <style>
    :root {
      --gold: #c9a45b;
      --gold-light: #f0d58a;
      --black: #070707;
      --card: rgba(10, 10, 10, .78);
      --white: #f7f5ef;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--black);
      color: var(--white);
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 18px;
      overflow: hidden;
      isolation: isolate;
    }

    .background {
      position: absolute;
      inset: 0;
      z-index: -3;
      background:
        linear-gradient(180deg, rgba(0,0,0,.38), rgba(0,0,0,.72) 55%, rgba(0,0,0,.92)),
        url("assets/barbearia.jpg") center center / cover no-repeat;
      transform: scale(1.03);
    }

    .vignette {
      position: absolute;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(circle at 50% 28%, rgba(201,164,91,.13), transparent 30%),
        linear-gradient(90deg, rgba(0,0,0,.34), transparent 45%, rgba(0,0,0,.38));
      pointer-events: none;
    }

    .card {
      width: min(100%, 430px);
      padding: 26px 20px 22px;
      text-align: center;
      border: 1px solid rgba(201,164,91,.55);
      border-radius: 28px;
      background: var(--card);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 25px 80px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.06);
    }

    .logo-frame {
      width: 142px;
      height: 142px;
      margin: 0 auto 18px;
      padding: 8px;
      border-radius: 50%;
      border: 1px solid var(--gold);
      background: rgba(255,255,255,.97);
      box-shadow: 0 0 0 5px rgba(201,164,91,.08), 0 10px 35px rgba(0,0,0,.45);
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    .logo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(29px, 8vw, 38px);
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--gold-light);
      text-shadow: 0 2px 18px rgba(0,0,0,.65);
    }

    .subtitle {
      margin: 9px 0 25px;
      color: rgba(255,255,255,.78);
      font-size: 14px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .line {
      width: 80px;
      height: 1px;
      margin: 0 auto 25px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    .buttons {
      display: grid;
      gap: 13px;
    }

    .button {
      position: relative;
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 67px;
      padding: 13px 18px;
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      border: 1px solid rgba(201,164,91,.65);
      background: linear-gradient(135deg, rgba(201,164,91,.18), rgba(0,0,0,.72));
      box-shadow: 0 10px 28px rgba(0,0,0,.30);
      transition: transform .2s ease, border-color .2s ease, background .2s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--gold-light);
      background: linear-gradient(135deg, rgba(201,164,91,.28), rgba(0,0,0,.74));
    }

    .wa {
      width: 43px;
      height: 43px;
      flex: 0 0 43px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #25D366;
      box-shadow: 0 5px 18px rgba(37,211,102,.25);
    }

    .wa svg { width: 24px; height: 24px; fill: #fff; }

    .label {
      text-align: left;
      line-height: 1.15;
    }

    .label strong {
      display: block;
      font-size: 16px;
      margin-bottom: 5px;
    }

    .label span {
      display: block;
      font-size: 12px;
      color: rgba(255,255,255,.62);
    }

    footer {
      margin-top: 24px;
      color: rgba(255,255,255,.45);
      font-size: 11px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    @media (max-width: 430px) {
      .page { padding: 16px 12px; }
      .card { padding: 22px 15px 18px; border-radius: 24px; }
      .logo-frame { width: 125px; height: 125px; }
    }
  </style>
</head>

            </svg>

          <span class="label">
            <strong>WhatsApp da Razor Barbearia</strong>

    </section>
  </main>
</body>
</html>
